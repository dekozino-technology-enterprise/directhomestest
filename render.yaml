services:
  - type: web
    name: house-mgmt-api
    runtime: node
    rootDir: backend
    plan: free                 # demo/test only; spins down when idle
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    # Free Render services do not support preDeployCommand or Shell access.
    # Apply committed migrations and the idempotent seed at each process start.
    startCommand: "npx prisma migrate deploy && npm run db:seed:prod && npm start"
    healthCheckPath: /api/health
    envVars:
      - { key: NODE_VERSION, value: "22" }
      - { key: NODE_ENV, value: development } # demo only: OTP codes go to logs; dev payment simulation is enabled
      - { key: REQUIRE_EMAIL_VERIFY, value: "false" }
      - { key: JWT_ACCESS_SECRET, generateValue: true }
      - { key: JWT_REFRESH_SECRET, generateValue: true }
      - { key: HASH_PEPPER, generateValue: true }
      - { key: DATA_ENC_KEY, sync: false }   # openssl rand -hex 32; back it up
      - { key: DATABASE_URL, sync: false }   # Supabase Transaction pooler URL
      - { key: DIRECT_URL, sync: false }     # Supabase Session pooler URL
      - { key: ADMIN_EMAIL, sync: false }
      - { key: ADMIN_PASSWORD, sync: false }
      - { key: WEB_ORIGIN, sync: false }     # Netlify URL; update after creating the site
      - { key: SUPABASE_URL, sync: false }
      - { key: SUPABASE_SERVICE_KEY, sync: false } # secret; server only
